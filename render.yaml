# ==============================================================================
# Render Blueprint Deployment Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: asterline-assistant
    runtime: docker
    plan: free
    branch: deploy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: asterline-batch5-assistant
